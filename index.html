<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>chris harrison - Concept 04</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header"><h1>chris harrison</h1><button id="themeBtn" aria-label="Toggle theme">Dark</button></header>
  <main>
    <section class="panel" id="contactPanel">
      <h2>Contact</h2>
      <form id="cform" novalidate>
        <label>Name<input name="name" required></label>
        <label>Email<input name="email" type="email" required></label>
        <label>Message<textarea name="msg" required></textarea></label>
        <button type="submit">Submit</button>
        <p id="status" class="note"></p>
      </form>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
